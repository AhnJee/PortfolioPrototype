<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prince Gian B. Alicudo Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: the Lab 8.2 high-fidelity page set, fluid to the full width and height of any
   screen. Colours, type and components follow the 8.2 style guide and component sheet.
   The site stays light in every viewer theme by choice, like the mockups. */
:root {
  color-scheme: light;
  --cyan: #0B7F9C;
  --bright: #1CB5D6;
  --deep: #0A5F75;
  --tint: #E3F4F8;
  --ink: #1F2A30;
  --grey: #56636B;
  --light: #F3F5F6;
  --line: #D8DDE0;
  --white: #FFFFFF;
  --head: Arial, Arimo, Helvetica, sans-serif;
  --body: Calibri, Carlito, "Segoe UI", Roboto, sans-serif;
  --name: clamp(26px, 1rem + 1.6vw, 60px);
  --section: clamp(19px, .6rem + .8vw, 34px);
  --text: clamp(16px, .55rem + .6vw, 26px);
  --caption: clamp(14px, .5rem + .5vw, 21px);
  --label: clamp(12px, .45rem + .35vw, 17px);
  --gutter: clamp(16px, 3vw, 56px);
  --gap: clamp(14px, 1.4vw, 28px);
  --r: 6px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { background: var(--white); }
body { margin: 0; background: var(--white); color: var(--ink); font: var(--text)/1.45 var(--body); }
h1, h2, h3 { margin: 0; font-family: var(--head); font-weight: 700; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--cyan); }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.ico { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.label { font-size: var(--label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--deep); }
.muted { color: var(--grey); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* App shell: fills the whole screen */
.app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
.pad { padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
header { position: relative; border-bottom: 1px solid var(--line); background: var(--white); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: clamp(10px, 1.2vw, 18px); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--ink); text-decoration: none; font-family: var(--head); font-weight: 700; font-size: var(--text); }
.mono { flex: none; display: grid; place-items: center; width: 2.2em; height: 2.2em; background: var(--cyan); color: var(--white); font-size: .8em; }
.brand .full { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav { display: flex; gap: clamp(4px, 1vw, 16px); }
nav a { padding: .45em 1.1em; border-radius: var(--r); color: var(--ink); text-decoration: none; white-space: nowrap; }
nav a:hover { background: var(--light); }
nav a[aria-current="page"] { background: var(--cyan); color: var(--white); font-weight: 700; }
.menu { display: none; width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; place-items: center; }
.menu .ico { width: 26px; height: 26px; }
main { flex: 1 0 auto; display: flex; flex-direction: column; padding-block: var(--gap); }
main:focus { outline: none; }
.page { flex: 1 0 auto; display: grid; gap: var(--gap); }
.col > * { flex-shrink: 0; }

/* Shared components */
.card { border: 1px solid var(--line); background: var(--white); padding: clamp(14px, 1.4vw, 26px); min-width: 0; }
.quote { background: var(--tint); color: var(--deep); padding: clamp(14px, 1.3vw, 24px); font-style: italic; font-weight: 700; font-size: calc(var(--text) * 1.08); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 46px; padding: .5em 1.4em; border: 1.5px solid var(--cyan); border-radius: var(--r); background: var(--white); color: var(--cyan); font-weight: 700; text-decoration: none; cursor: pointer; }
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--cyan); color: var(--white); }
.btn.primary:hover { background: var(--deep); }
.sq { display: grid; place-items: center; width: 2.4em; height: 2.4em; min-width: 46px; min-height: 46px; padding: 0; border: 0; border-radius: var(--r); background: var(--cyan); color: var(--white); cursor: pointer; }
.sq:hover { background: var(--deep); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { padding: .2em .9em; border: 1px solid var(--deep); border-radius: var(--r); color: var(--deep); font-size: var(--caption); font-weight: 700; }
.ph { position: relative; display: grid; place-items: center; width: 100%; height: 100%; padding: 8px; background: var(--light); color: var(--grey); font-size: var(--caption); text-align: center; overflow: hidden; }
.ph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ph line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ph span { position: relative; padding: 0 6px; background: var(--light); }
.fill { width: 100%; height: 100%; object-fit: cover; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.sechead h2 { font-size: var(--section); }
.viewall { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--caption); text-decoration: none; white-space: nowrap; }
.viewall:hover { text-decoration: underline; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows a { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: .5em 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.rows a:hover { color: var(--cyan); }
.rows a .ico { color: var(--cyan); }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.tile { display: grid; place-items: center; width: 2.4em; height: 2.4em; background: var(--cyan); color: var(--white); font-family: var(--head); font-weight: 700; text-decoration: none; }
.tile.off { opacity: .55; }
a.tile:hover { background: var(--deep); }
.circle { border-radius: 50%; overflow: hidden; aspect-ratio: 1; flex: none; }

/* Home */
.home { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.hero { position: relative; display: grid; grid-template-columns: 52% 48%; flex: 1.3 0 auto; min-height: clamp(220px, 30vh, 420px); border: 1px solid var(--line); overflow: hidden; }
.hero-text { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: clamp(16px, 2vw, 36px); }
.hero-text h1 { font-size: var(--name); }
.role { color: var(--cyan); font-weight: 700; margin-top: 6px; }
.hero-photo { margin-left: -24%; min-width: 0; }
.hero-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 45%); mask-image: linear-gradient(to right, transparent 0, #000 45%); }
.strengths { flex: 1 0 auto; }
.strengths h2 { font-size: var(--section); margin-bottom: 8px; }
.strengths ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.feature { position: relative; flex: 1.3 0 auto; min-height: clamp(220px, 30vh, 420px); display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: clamp(18px, 2vw, 36px) clamp(64px, 6vw, 96px); background: var(--cyan); color: var(--white); overflow: hidden; }
.feature .label { color: var(--white); opacity: .9; }
.feature h2 { font-size: calc(var(--section) * 1.2); }
.feature .ctl { position: absolute; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: var(--white); color: var(--cyan); cursor: pointer; }
.feature .ctl:hover { background: var(--tint); }
.feature .prev { left: clamp(12px, 1.4vw, 24px); }
.feature .next { right: clamp(12px, 1.4vw, 24px); }
.feature .full { position: absolute; right: clamp(12px, 1.4vw, 24px); bottom: clamp(12px, 1.4vw, 24px); display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: var(--r); background: var(--white); color: var(--cyan); cursor: pointer; }
.dots { display: flex; gap: 8px; margin-top: 6px; }
.dots button { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 50%; background: var(--bright); cursor: pointer; }
.dots button[aria-current="true"] { background: var(--white); }
.feature.is-full { position: fixed; inset: 0; z-index: 50; min-height: 0; padding-left: max(80px, env(safe-area-inset-left, 0px)); padding-right: max(80px, env(safe-area-inset-right, 0px)); }
.feature.is-full h2 { font-size: calc(var(--name) * 1.4); }
.feature.is-full p { font-size: calc(var(--text) * 1.3); }
.homelist { display: grid; gap: 4px; }

/* About */
.about { grid-template-columns: minmax(0, 1fr) minmax(0, 1.9fr); }
.about-photo { border: 1px solid var(--line); overflow: hidden; min-height: 320px; }
.about-photo img { object-position: 50% 20%; }
.about .col h1 { font-size: var(--name); }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); flex: 1 0 auto; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); flex: 1 0 auto; }
.icard { display: flex; flex-direction: column; gap: 10px; }
.icard .badge { display: grid; place-items: center; width: 40px; height: 40px; background: var(--tint); color: var(--cyan); }
.icard .head { display: flex; align-items: center; gap: 10px; }
.icard .head .ico { color: var(--cyan); width: 26px; height: 26px; }
.icard strong { font-size: calc(var(--text) * 1.02); }

/* Achievements */
.ach { grid-template-columns: minmax(0, 1fr) minmax(0, 2.4fr) minmax(0, 1fr); grid-template-rows: 1fr auto; align-items: center; }
.peek { align-self: center; display: flex; flex-direction: column; gap: 10px; min-height: 40%; padding: clamp(14px, 1.4vw, 26px); border: 1px solid var(--line); background: var(--light); color: var(--ink); text-align: left; cursor: pointer; }
.peek:hover { border-color: var(--cyan); }
.peek .dir { display: flex; align-items: center; gap: 4px; color: var(--cyan); font-weight: 700; font-size: var(--caption); }
.peek strong { font-family: var(--head); font-size: var(--text); }
.acard { align-self: stretch; display: flex; flex-direction: column; border: 1px solid var(--line); }
.acard .doc { flex: 1.3 0 auto; display: grid; place-items: center; padding: clamp(16px, 2.4vw, 44px) clamp(16px, 4vw, 80px) 0; background: linear-gradient(to bottom, var(--tint) 55%, var(--white)); min-height: 200px; }
.acard .doc .frame { width: 100%; height: 100%; min-height: 160px; border: 1px solid var(--line); background: var(--white); }
.acard .doc .ph { background: var(--white); }
.acard .doc .ph span { background: var(--white); }
.acard .body { display: flex; flex-direction: column; gap: 10px; padding: clamp(14px, 1.6vw, 28px) clamp(16px, 3vw, 48px); text-align: center; }
.acard h2 { font-size: calc(var(--section) * 1.15); }
.acard .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); font-size: var(--caption); text-align: left; }
.acard .meta b { color: var(--cyan); }
.pager { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 24px; }
.pager span { color: var(--grey); font-size: var(--caption); font-variant-numeric: tabular-nums; }

/* Projects */
.proj { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: stretch; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.plist h1 { font-size: var(--section); margin-bottom: 4px; }
.prow { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; flex: 1 0 auto; max-height: 92px; min-height: 56px; padding: 8px clamp(12px, 1.2vw, 20px); border: 1px solid var(--line); background: var(--white); text-align: left; cursor: pointer; }
.prow:hover { border-color: var(--cyan); }
.prow span { display: grid; min-width: 0; }
.prow b { overflow-wrap: anywhere; }
.prow small { color: var(--grey); font-size: var(--caption); }
.prow .ico { color: var(--cyan); }
.prow[aria-pressed="true"] { background: var(--cyan); border-color: var(--cyan); color: var(--white); }
.prow[aria-pressed="true"] small, .prow[aria-pressed="true"] .ico { color: var(--white); }
.panel { display: flex; flex-direction: column; gap: var(--gap); }
.ptop { display: flex; align-items: center; gap: var(--gap); }
.ptop .circle { width: clamp(110px, 11vw, 200px); border: 1px solid var(--line); }
.ptop h2 { font-size: var(--section); }
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; flex: 1 0 auto; }
.thumb { display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; cursor: pointer; text-align: center; font-size: var(--caption); font-weight: 700; }
.thumb .box { flex: 1 1 auto; min-height: 90px; width: 100%; border: 1px solid var(--line); overflow: hidden; }
.thumb:hover .box { border-color: var(--cyan); }
.docs h2 { font-size: var(--section); margin-bottom: 6px; }
.docs p b { color: var(--cyan); }

/* Project detail */
.crumb { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: var(--gap); font-size: var(--caption); color: var(--grey); }
.crumb a { font-weight: 700; text-decoration: none; }
.detail { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.gallery { display: grid; grid-template-rows: 1fr auto; gap: 12px; min-height: 0; }
.gallery .main { min-height: 260px; border: 1px solid var(--line); }
.gallery .small { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.gallery .small div { aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid var(--line); }
.dinfo { display: flex; flex-direction: column; gap: 12px; }
.dinfo h1 { font-size: calc(var(--section) * 1.2); }
.dinfo .meta { color: var(--cyan); font-weight: 700; }
.dinfo .card { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.dinfo .btn { align-self: flex-start; }

/* Contact */
.contact { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.contact h1 { font-size: var(--name); }
form { display: flex; flex-direction: column; gap: 12px; flex: 1 0 auto; }
label { display: grid; gap: 4px; font-weight: 700; font-size: var(--caption); }
input, textarea { width: 100%; padding: .6em .8em; border: 1px solid var(--line); background: var(--white); font-weight: 400; font-size: var(--text); }
input:focus, textarea:focus { outline: none; border: 2px solid var(--cyan); padding: calc(.6em - 1px) calc(.8em - 1px); }
.msg { flex: 1 0 auto; display: grid; grid-template-rows: auto 1fr; }
textarea { min-height: 140px; height: 100%; resize: vertical; }
form .btn { align-self: flex-start; }
.status { padding: 10px 14px; background: var(--tint); color: var(--deep); }
.me { display: flex; align-items: center; gap: var(--gap); padding-bottom: var(--gap); border-bottom: 1px solid var(--line); }
.me .circle { width: clamp(96px, 8vw, 150px); border: 1px solid var(--line); }
.me h2 { font-size: var(--section); }
.links { display: flex; flex-direction: column; flex: 1 0 auto; }
.link { display: flex; align-items: center; gap: 14px; flex: 1 0 auto; min-height: 64px; max-height: 110px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.link .tile { width: 2.2em; height: 2.2em; }
.link .txt { flex: 1 0 auto; display: grid; min-width: 0; }
.link .txt small { color: var(--grey); font-size: var(--caption); overflow-wrap: anywhere; }
.link > .ico { color: var(--cyan); }
a.link:hover b { color: var(--cyan); }

@media (max-width: 1000px) {
  .home, .about, .proj, .detail, .contact { grid-template-columns: minmax(0, 1fr); }
  .about-photo { aspect-ratio: 4 / 5; max-width: 100%; max-height: 70vh; }
  .ach { grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 10px; }
  .peek { min-height: 160px; padding: 0; align-items: center; justify-content: center; }
  .peek strong, .peek .dir span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .peek .dir .ico { width: 26px; height: 26px; }
  .prow { flex: none; }
}
@media (max-width: 760px) {
  .menu { display: grid; }
  nav { display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 20; flex-direction: column; gap: 4px; padding: 10px max(var(--gutter), env(safe-area-inset-right, 0px)) 14px max(var(--gutter), env(safe-area-inset-left, 0px)); background: var(--white); border-bottom: 1px solid var(--line); box-shadow: 0 8px 16px rgba(31, 42, 48, .08); }
  nav.open { display: flex; }
  nav a { padding: .7em 1em; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-photo { order: -1; margin: 0; height: 300px; }
  .hero-photo img { -webkit-mask-image: linear-gradient(to bottom, #000 75%, transparent); mask-image: linear-gradient(to bottom, #000 75%, transparent); }
  .hero-text { padding-top: 0; }
  .three, .two { grid-template-columns: minmax(0, 1fr); }
  .ptop { flex-direction: column; align-items: flex-start; }
  .feature { padding-left: 64px; padding-right: 64px; }
}
@media (max-width: 420px) {
  .brand .full { display: none; }
  .brand::after { content: "Prince Gian B."; }
}
@media (prefers-reduced-motion: no-preference) {
  .fadein { animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity: .4; } to { opacity: 1; } }
}
</style>
</head>
<body>


<div class="app">
  <header>
    <div class="bar pad">
      <a class="brand" href="#home"><span class="mono" aria-hidden="true">PA</span><span class="full" id="brand-name"></span></a>
      <button class="menu" id="menu" aria-label="Open menu" aria-expanded="false" aria-controls="nav"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <nav id="nav" aria-label="Main">
        <a href="#home" data-nav="home">Home</a>
        <a href="#achievements" data-nav="achievements">Achievements</a>
        <a href="#projects" data-nav="projects">Projects</a>
        <a href="#contact" data-nav="contact">Contact</a>
      </nav>
    </div>
  </header>
  <main class="pad" id="view" tabindex="-1"></main>

const href = l => l.key === "email" && l.url && !l.url.includes(":") ? "mailto:" + l.url : l.url;

function featured() {
  const f = SITE.featured[state.slide];
  return `<section class="feature" id="feature" aria-roledescription="slideshow" aria-label="Featured projects">
    <p class="label">${esc(f.eyebrow)}</p>
    <h2 class="fadein">${esc(f.title)}</h2>
    <p class="fadein">${esc(f.text)}</p>
    <div class="dots">${SITE.featured.map((_, i) => `<button data-act="dot" data-i="${i}" aria-label="Show featured project ${i + 1}" aria-current="${i === state.slide}"></button>`).join("")}</div>
    <button class="ctl prev" data-act="slide" data-d="-1" aria-label="Previous featured project">${ico("chevL")}</button>
    <button class="ctl next" data-act="slide" data-d="1" aria-label="Next featured project">${ico("chev")}</button>
    <button class="full" data-act="full" aria-label="Open full screen">${ico("expand")}</button>
  </section>`;
}

const pages = {
  home: () => `<div class="page home">
    <div class="col">
      <section class="hero">
        <div class="hero-text">
          <h1>${esc(SITE.name)}</h1>
          <p class="role">${esc(SITE.role)}</p>
          <p class="muted">${esc(SITE.school)}</p>
          <a class="viewall" href="#about">About me ${ico("arrow")}</a>
        </div>
        <div class="hero-photo"><img src="${IMG.hero}" alt="Prince Gian B. Alicudo"></div>
      </section>
      <p class="quote">“${esc(SITE.quote)}”</p>
      <section class="card strengths"><h2>Strengths</h2><ul>${SITE.strengths.map(s => `<li>${esc(s)}</li>`).join("")}</ul></section>
      <div class="tiles">${SITE.links.map(l => l.url
        ? `<a class="tile" href="${esc(href(l))}" target="_blank" rel="noopener" aria-label="${l.label}">${linkIcon(l.key)}</a>`
        : `<span class="tile off" title="${l.label} link not added yet" aria-label="${l.label} link not added yet">${linkIcon(l.key)}</span>`).join("")}</div>
    </div>
    <div class="col">
      <div id="feature-slot" style="display:flex;flex:1.3 0 auto">${featured()}</div>
      <section class="homelist">
        <div class="sechead"><h2>Achievements</h2><a class="viewall" href="#achievements">View all ${ico("arrow")}</a></div>
        <ul class="rows">${SITE.achievements.slice(0, 3).map((a, i) => `<li><a href="#achievements" data-ach="${i}">${esc(a.name)} ${ico("chev")}</a></li>`).join("")}</ul>
      </section>
      <section class="homelist">
        <div class="sechead"><h2>Works / Finished Projects</h2><a class="viewall" href="#projects">View all ${ico("arrow")}</a></div>
        <ul class="rows">${SITE.projects.slice(0, 3).map((p, i) => `<li><a href="#project-${i + 1}">${esc(p.title)} ${ico("chev")}</a></li>`).join("")}</ul>
      </section>
    </div>
  </div>`,

  about: () => `<div class="page about">
    <div class="about-photo"><img class="fill" src="${IMG.about}" alt="Prince Gian B. Alicudo in a black suit on campus"></div>
    <div class="col">
      <h1>About me</h1>
      <p class="muted">${esc(SITE.about)}</p>
      <p class="quote">“${esc(SITE.quote)}”</p>
      <div class="three">${SITE.strengths.map((s, i) => `<div class="card icard"><span class="badge">${ico(["tool", "users", "layout"][i % 3])}</span><strong>${esc(s)}</strong></div>`).join("")}</div>
      <div class="two">
        <section class="card icard"><div class="head">${ico("book")}<h2 class="label">Education</h2></div><strong>${esc(SITE.education.school)}</strong><p class="muted">${esc(SITE.education.detail)}</p></section>
        <section class="card icard"><div class="head">${ico("code")}<h2 class="label">Tools used in projects</h2></div><div class="tags">${SITE.tools.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></section>
      </div>
    </div>
  </div>`,

  achievements: () => {
    const L = SITE.achievements, n = L.length, i = state.ach, a = L[i];
    const prev = L[(i - 1 + n) % n], next = L[(i + 1) % n];
    return `<h1 class="sr">Achievements</h1><div class="page ach">
      <button class="peek" data-act="ach" data-d="-1" aria-label="Previous: ${esc(prev.name)}"><span class="dir">${ico("chevL")}<span>Previous</span></span><strong>${esc(prev.name)}</strong></button>
      <article class="acard fadein">
        <div class="doc"><div class="frame">${pic(a.image)}</div></div>
        <div class="body">
          <h2>${esc(a.name)}</h2>
          <p class="muted">${esc(a.text)}</p>
          <div class="meta"><span><b>Collaborations:</b> ${esc(a.collab)}</span><strong>${esc(a.date)}</strong></div>
        </div>
      </article>
      <button class="peek" data-act="ach" data-d="1" aria-label="Next: ${esc(next.name)}"><span class="dir"><span>Next</span>${ico("chev")}</span><strong>${esc(next.name)}</strong></button>
      <div class="pager">
        <button class="sq" data-act="ach" data-d="-1" aria-label="Previous achievement">${ico("chevL")}</button>
        <span>${i + 1} / ${n}</span>
        <button class="sq" data-act="ach" data-d="1" aria-label="Next achievement">${ico("chev")}</button>
      </div>
    </div>`;
  },

  projects: () => {
    const p = SITE.projects[state.project];
    const big = state.big === null ? ME : p.shots[state.big];
    return `<div class="page proj">
      <section class="plist">
        <h1>Project List</h1>
        ${SITE.projects.map((q, i) => `<button class="prow" data-act="project" data-i="${i}" aria-pressed="${i === state.project}"><span><b>${esc(q.title)}</b><small>${esc(q.type)}</small></span>${ico("chev")}</button>`).join("")}
      </section>
      <section class="card panel fadein" aria-label="${esc(p.title)}">
        <div class="ptop">
          <div class="circle">${pic(big)}</div>
          <div style="display:grid;gap:6px;min-width:0"><h2>${esc(p.title)}</h2><p class="role" style="margin:0">${esc(p.role)}</p><p class="muted">${esc(p.summary)}</p></div>
        </div>
        <div class="thumbs">${p.shots.map((s, i) => `<button class="thumb" data-act="thumb" data-i="${i}" aria-label="Show ${esc(s.label)} in the large picture"><span class="box">${pic(s)}</span>${esc(s.label)}</button>`).join("")}</div>
        <div class="docs">
          <h2>Project Documentation</h2>
          <p><b>Problem:</b> ${esc(p.problem)}</p>
          <p><b>Tech:</b> ${esc(p.tech)}</p>
          <p><b>Result:</b> ${esc(p.result)}</p>
        </div>
        <a class="viewall" href="#project-${state.project + 1}">Open project page ${ico("arrow")}</a>
      </section>
    </div>`;
  },

  project: i => {
    const p = SITE.projects[i];
    return `<div class="crumb"><a href="#projects">Projects</a><span>›</span><span>${esc(p.title)}</span></div>
    <div class="page detail">
      <div class="gallery">
        <div class="main">${pic(p.hero)}</div>
        <div class="small">${p.shots.map(s => `<div>${pic(s)}</div>`).join("")}</div>
      </div>
      <div class="dinfo">
        <h1>${esc(p.title)}</h1>
        <p class="meta">${esc(p.type)} · ${esc(p.role)}</p>
        <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <section class="card"><h2 class="label">Problem</h2><p>${esc(p.problem)}</p></section>
        <section class="card"><h2 class="label">Tech</h2><p>${esc(p.tech)}</p></section>
        <section class="card"><h2 class="label">Result</h2><p>${esc(p.result)}</p></section>
        <a class="btn" href="#projects">${ico("chevL")} Back to projects</a>
      </div>
    </div>`;
  },

  contact: () => `<div class="page contact">
    <section class="col">
      <h1>Get in touch</h1>
      <p class="muted">${esc(SITE.contactText)}</p>
      <form class="card" id="form" style="display:flex">
        <label for="c-name">Name<input id="c-name" name="name" placeholder="Your name" required autocomplete="name"></label>
        <label for="c-email">Email<input id="c-email" name="email" type="email" placeholder="you@example.com" required autocomplete="email"></label>
        <label class="msg" for="c-msg">Message<textarea id="c-msg" name="message" placeholder="Write your message here" required></textarea></label>
        <button class="btn primary" type="submit">${ico("send")} Send message</button>
        <p class="status" id="status" role="status" hidden></p>
      </form>
    </section>
    <aside class="card col">
      <div class="me">
        <div class="circle"><img class="fill" src="${IMG.square}" alt="Portrait of Prince Gian B. Alicudo"></div>
        <div style="display:grid;gap:4px;min-width:0"><h2>${esc(SITE.name)}</h2><p class="role" style="margin:0">${esc(SITE.role)}</p><p class="muted">${esc(SITE.school)}</p></div>
      </div>
      <div class="links">${SITE.links.map(l => {
        const inner = `<span class="tile">${linkIcon(l.key)}</span><span class="txt"><b>${l.label}</b><small>${esc(l.url || l.hint)}</small></span>${ico("arrow")}`;
        return l.url ? `<a class="link" href="${esc(href(l))}" target="_blank" rel="noopener">${inner}</a>` : `<div class="link">${inner}</div>`;
      }).join("")}</div>
    </aside>
  </div>`
};

function route() {
  const hash = location.hash.slice(1) || "home";
  const m = hash.match(/^project-(\d+)$/);
  const idx = m ? Number(m[1]) - 1 : -1;
  const isP = idx >= 0 && idx < SITE.projects.length;
  const name = isP ? "project" : (pages[hash] && hash !== "project" ? hash : "home");
  if (isP) { state.project = idx; state.big = null; }
  view.innerHTML = isP ? pages.project(idx) : pages[name]();
  const active = isP ? "projects" : name;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === active ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  nav.classList.remove("open"); menu.setAttribute("aria-expanded", "false");
  document.body.style.overflow = "";
  window.scrollTo(0, 0);
  view.focus({ preventScroll: true });
}
const rerender = name => { view.innerHTML = pages[name](); };

function setFull(on) {
  const el = document.getElementById("feature");
  if (!el) return;
  el.classList.toggle("is-full", on);
  document.body.style.overflow = on ? "hidden" : "";
  el.querySelector(".full").setAttribute("aria-label", on ? "Close full screen" : "Open full screen");
}
function showSlide(i) {
  const full = document.getElementById("feature").classList.contains("is-full");
  state.slide = (i + SITE.featured.length) % SITE.featured.length;
  document.getElementById("feature-slot").innerHTML = featured();
  if (full) setFull(true);
}

view.addEventListener("click", e => {
  const r = e.target.closest("[data-ach]");
  if (r) state.ach = Number(r.dataset.ach);
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, d = Number(b.dataset.d), i = Number(b.dataset.i);
  if (act === "slide") showSlide(state.slide + d);
  else if (act === "dot") showSlide(i);
  else if (act === "full") setFull(!document.getElementById("feature").classList.contains("is-full"));
  else if (act === "ach") { state.ach = (state.ach + d + SITE.achievements.length) % SITE.achievements.length; rerender("achievements"); }
  else if (act === "project") { state.project = i; state.big = null; rerender("projects"); }
  else if (act === "thumb") { state.big = state.big === i ? null : i; rerender("projects"); }
});

view.addEventListener("submit", e => {
  e.preventDefault();
  const box = document.getElementById("status");
  box.textContent = `Thanks, ${e.target.elements.name.value.trim()}. This form is a prototype, so your message was not delivered. Please use the links on this page to reach me.`;
  box.hidden = false;
});

menu.addEventListener("click", () => {
  const open = !nav.classList.contains("open");
  nav.classList.toggle("open", open);
  menu.setAttribute("aria-expanded", String(open));
  menu.setAttribute("aria-label", open ? "Close menu" : "Open menu");
});

document.addEventListener("keydown", e => {
  const el = document.getElementById("feature");
  if (!el || !el.classList.contains("is-full")) return;
  if (e.key === "Escape") setFull(false);
  if (e.key === "ArrowLeft") showSlide(state.slide - 1);
  if (e.key === "ArrowRight") showSlide(state.slide + 1);
});

document.getElementById("brand-name").textContent = SITE.name;
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
